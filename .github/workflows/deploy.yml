name: Deploy Vanilla Frontend to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Add DigitalOcean host
        run: |
          ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts
      
      - name: Show SSH key fingerprint
        run: |
          echo "Private key fingerprint:"
          ssh-keygen -lf "$HOME/.ssh/deploy_key"

          echo "Public key fingerprint:"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" | ssh-keygen -lf -

      - name: Test SSH
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            "echo 'SSH connection successful' && ls -ld /var/www"

      - name: Deploy to DigitalOcean
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf - . | \
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            "${DO_USER}@${DO_HOST}" \
            "tar -xzf - -C /var/www/"